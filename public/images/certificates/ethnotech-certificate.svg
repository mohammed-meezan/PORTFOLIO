<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 724" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&amp;family=Montserrat:wght@400;600;700;800&amp;display=swap');
      .title-serif { font-family: 'Playfair Display', Georgia, serif; }
      .sans { font-family: 'Montserrat', -apple-system, sans-serif; }
    </style>
  </defs>

  <!-- Background White Paper -->
  <rect width="1024" height="724" fill="#FFFFFF"/>

  <!-- Ornate Outer Border -->
  <rect x="20" y="20" width="984" height="684" fill="none" stroke="#0B3C5D" stroke-width="12" rx="4"/>
  <rect x="36" y="36" width="952" height="652" fill="none" stroke="#0B3C5D" stroke-width="2" rx="2"/>

  <!-- Corner Ornament Blocks -->
  <g fill="#0B3C5D">
    <rect x="26" y="26" width="60" height="60" fill="#0B3C5D" opacity="0.15" rx="4"/>
    <rect x="938" y="26" width="60" height="60" fill="#0B3C5D" opacity="0.15" rx="4"/>
    <rect x="26" y="638" width="60" height="60" fill="#0B3C5D" opacity="0.15" rx="4"/>
    <rect x="938" y="638" width="60" height="60" fill="#0B3C5D" opacity="0.15" rx="4"/>
  </g>

  <!-- Top Logos -->
  <!-- Left: NSDC -->
  <g transform="translate(130, 65)">
    <circle cx="28" cy="18" r="6" fill="#15803D"/>
    <circle cx="48" cy="18" r="6" fill="#0284C7"/>
    <circle cx="68" cy="18" r="6" fill="#DC2626"/>
    <path d="M20 38 Q48 20 76 38" fill="none" stroke="#EA580C" stroke-width="4" stroke-linecap="round"/>
    <text x="48" y="62" class="sans" font-weight="800" font-size="14" fill="#0B3C5D" text-anchor="middle" letter-spacing="3">N·S·D·C</text>
  </g>

  <!-- Center: Ethnotech Academy -->
  <g transform="translate(390, 75)">
    <!-- Asterisk Flower Logo -->
    <g fill="#0284C7" transform="translate(0, 4)">
      <ellipse cx="20" cy="20" rx="4" ry="12" transform="rotate(0 20 20)"/>
      <ellipse cx="20" cy="20" rx="4" ry="12" transform="rotate(45 20 20)"/>
      <ellipse cx="20" cy="20" rx="4" ry="12" transform="rotate(90 20 20)"/>
      <ellipse cx="20" cy="20" rx="4" ry="12" transform="rotate(135 20 20)"/>
      <circle cx="20" cy="20" r="5" fill="#FFFFFF"/>
    </g>
    <text x="50" y="20" class="sans" font-weight="700" font-size="16" fill="#0B3C5D" letter-spacing="3">ETHNOTECH</text>
    <text x="50" y="36" class="sans" font-weight="600" font-size="11" fill="#0B3C5D" letter-spacing="5">ACADEMY</text>
  </g>

  <!-- Right: MIT Maharaja Institute of Technology Logo -->
  <g transform="translate(790, 65)">
    <circle cx="45" cy="45" r="42" fill="#0B3C5D"/>
    <circle cx="45" cy="45" r="33" fill="#FFFFFF"/>
    <circle cx="45" cy="45" r="28" fill="#F97316"/>
    <text x="45" y="55" class="sans" font-weight="900" font-size="22" fill="#FFFFFF" text-anchor="middle">MIT</text>
    <!-- Circular text arc simulation -->
    <text x="45" y="16" class="sans" font-weight="700" font-size="5" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">MAHARAJA INSTITUTE OF TECHNOLOGY</text>
  </g>

  <!-- Title Section -->
  <text x="512" y="235" class="title-serif" font-size="28" font-style="italic" fill="#0B3C5D" text-anchor="middle">Certificate of</text>
  <text x="512" y="295" class="title-serif" font-size="62" font-weight="bold" fill="#0B3C5D" text-anchor="middle" letter-spacing="1">Internship</text>
  <text x="512" y="335" class="sans" font-size="15" font-weight="600" fill="#334155" text-anchor="middle">This is to certify that</text>

  <!-- Recipient Name -->
  <g transform="translate(512, 395)">
    <text x="0" y="0" class="sans" font-size="26" font-weight="800" fill="#0B3C5D" text-anchor="middle" letter-spacing="2">MOHAMMED MEEZAN</text>
    <line x1="-220" y1="12" x2="220" y2="12" stroke="#0B3C5D" stroke-width="2"/>
  </g>

  <!-- Certificate Body Text -->
  <g transform="translate(512, 445)">
    <text x="0" y="0" class="title-serif" font-size="16" fill="#1E293B" text-anchor="middle" font-style="italic">
      " has successfully completed an Internship in Python Full Stack Development at
    </text>
    <text x="0" y="28" class="title-serif" font-size="16" fill="#1E293B" text-anchor="middle" font-style="italic">
      Ethnotech Academy from 23rd Feb 2026 to 13th March, 2026. During this period,
    </text>
    <text x="0" y="56" class="title-serif" font-size="16" fill="#1E293B" text-anchor="middle" font-style="italic">
      the student demonstrated dedication and gained practical knowledge in full-stack
    </text>
    <text x="0" y="84" class="title-serif" font-size="16" fill="#1E293B" text-anchor="middle" font-style="italic">
      web development using Python."
    </text>
  </g>

  <!-- Signatures Section -->
  <!-- Left Signature: Dr. Manju B (Principal) -->
  <g transform="translate(260, 595)">
    <path d="M-30 0 Q-10 -15 15 -5 T40 -20 Q20 5 -5 10" fill="none" stroke="#0B3C5D" stroke-width="2" stroke-linecap="round"/>
    <line x1="-70" y1="15" x2="70" y2="15" stroke="#94A3B8" stroke-width="1"/>
    <text x="0" y="32" class="title-serif" font-size="17" font-weight="bold" fill="#0B3C5D" text-anchor="middle">Dr. Manju B</text>
    <text x="0" y="48" class="sans" font-size="11" fill="#64748B" text-anchor="middle">Principal</text>
  </g>

  <!-- Right Signature: Dr. Kiran K Rajanna (CEO) -->
  <g transform="translate(740, 580)">
    <path d="M-25 15 Q0 -25 20 0 T35 -15 Q15 25 -10 15" fill="none" stroke="#0B3C5D" stroke-width="2" stroke-linecap="round"/>
    <line x1="-70" y1="30" x2="70" y2="30" stroke="#94A3B8" stroke-width="1"/>
    <text x="0" y="47" class="title-serif" font-size="17" font-weight="bold" fill="#0B3C5D" text-anchor="middle">Dr. Kiran K Rajanna</text>
    <text x="0" y="63" class="sans" font-size="11" fill="#64748B" text-anchor="middle">CEO, Ethnotech Academy</text>
  </g>
</svg>
